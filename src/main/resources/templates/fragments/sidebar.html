<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>

<div th:fragment="sidebar">
    <div id="sidebar">
        <h4 class="text-center py-3">Pediu Patrão</h4>

        <ul class="nav flex-column">
            <li class="nav-item">
                <a class="nav-link" th:href="@{/}">
                    <i class="bi bi-house"></i>
                    <span>&nbsp;Home</span>
                </a>
            </li>

            <li class="nav-item"
                th:if="${#authorization.expression(
                    'hasAnyRole(''GERENTE'', ''ATENDENTE'')')}">
                <a class="nav-link" th:href="@{/clientes}">
                    <i class="bi bi-person-raised-hand"></i>
                    <span>&nbsp;Clientes</span>
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link" th:href="@{/pedidos}">
                    <i class="bi bi-bag"></i>
                    <span>&nbsp;Pedidos</span>
                </a>
            </li>

            <li class="nav-item"
                th:if="${#authorization.expression(
                    'hasAnyRole(''GERENTE'', ''ATENDENTE'')')}">
                <a class="nav-link" th:href="@{/produtos}">
                    <i class="bi bi-boxes"></i>
                    <span>&nbsp;Produtos</span>
                </a>
            </li>

            <li class="nav-item"
                th:if="${#authorization.expression(
                    'hasRole(''ADMIN'')')}">
                <a class="nav-link" th:href="@{/usuarios}">
                    <i class="bi bi-people-fill"></i>
                    <span>&nbsp;Usuários</span>
                </a>
            </li>

            <li class="nav-item"
                th:if="${#authorization.expression(
                    'hasAnyRole(''ADMIN'', ''GERENTE'')')}">
                <a class="nav-link" th:href="@{/auditoria}">
                    <i class="bi bi-clock-history"></i>
                    <span>&nbsp;Auditoria</span>
                </a>
            </li>

            <li class="nav-item mt-3">
                <form th:action="@{/logout}"
                      method="post"
                      class="px-3">
                    <button type="submit"
                            class="btn btn-outline-light w-100">
                        <i class="bi bi-box-arrow-right me-2"></i>
                        Sair
                    </button>
                </form>
            </li>
        </ul>
    </div>
</div>

</body>
</html>
