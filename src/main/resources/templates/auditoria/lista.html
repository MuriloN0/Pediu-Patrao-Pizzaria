<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Auditoria</title>
</head>
<body>

<div th:fragment="content">
    <h2 class="mb-4">Auditoria</h2>

    <p th:if="${#lists.isEmpty(eventos)}">
        Nenhum registro de auditoria encontrado.
    </p>

    <div class="card mb-3" th:each="evento : ${eventos}">
        <div class="card-header">
            <strong th:text="${evento.operacao}"></strong>
            —
            <span class="data-auditoria"
                  th:attr="data-instante=${evento.dataHora}"></span>
        </div>

        <div class="card-body">
            <p>
                Usuário:
                <strong th:text="${evento.usuario}"></strong>
                — Perfil:
                <span th:text="${evento.perfil}"></span>
            </p>

            <p>
                Entidade:
                <span th:text="${evento.entidade}"></span>
                — Identificador:
                <span th:text="${evento.entidadeId}"></span>
            </p>

            <p th:if="${evento.justificativa != null
                         and !#strings.isEmpty(evento.justificativa)}">
                Justificativa:
                <span th:text="${evento.justificativa}"></span>
            </p>

            <div class="table-responsive">
                <table class="table table-bordered">
                    <thead>
                    <tr>
                        <th>Campo</th>
                        <th>Valor anterior</th>
                        <th>Valor novo</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="alteracao : ${evento.alteracoes}">
                        <td th:text="${alteracao.campo}"></td>

                        <td th:text="${alteracao.valorAnterior == null
                            ? '—' : alteracao.valorAnterior}"></td>

                        <td th:text="${alteracao.valorNovo == null
                            ? '—' : alteracao.valorNovo}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        document.querySelectorAll(".data-auditoria")
            .forEach(elemento => {
                const instante = elemento.dataset.instante;

                elemento.textContent = instante ? new Date(instante).toLocaleString("pt-BR") : "—";

            });
    </script>
</div>

</body>
</html>
